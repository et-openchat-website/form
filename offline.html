<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5715">
  <title>オフラインです｜ET利用者アンケート管理サイト</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6fbf0;color:#263321;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}.card{width:min(520px,100%);padding:32px;background:#fff;border:1px solid #dce8d2;border-radius:20px;box-shadow:0 8px 24px rgba(45,79,24,.07);text-align:center}.logo{width:72px;height:72px;object-fit:contain;border-radius:16px;background:#fff}h1{margin:16px 0 8px;color:#23420e;font-size:1.5rem}.message{margin:0 0 24px}.retry{display:inline-block;padding:11px 18px;border-radius:10px;background:#568f24;color:#fff;text-decoration:none;font-weight:700}.note{margin:18px 0 0;color:#687564;font-size:.9rem}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./assets/et-survey-logo.png" alt="">
    <h1>オフラインです</h1>
    <p class="message">インターネットに接続できません。接続を確認して、もう一度お試しください。</p>
    <a class="retry" href="./">再読み込み</a>
    <p class="note">ログイン、アンケート回答、グラフ、集計データはオフラインでは利用できません。個人情報や回答データは端末に保存していません。</p>
  </main>
</body>
</html>
